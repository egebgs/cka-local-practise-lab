# Without mouse mode, xterm.js translates wheel-scroll into up/down-arrow key
# sequences (its default behavior for full-screen apps) -- since tmux itself is
# always "full-screen" from the terminal's point of view, that arrow-key translation
# gets forwarded straight to the shell, where it looks like pressing the Up key
# (previous command history) instead of scrolling. Mouse mode makes tmux handle
# wheel-scroll itself (entering copy-mode and scrolling real pane history).
set -g mouse on
